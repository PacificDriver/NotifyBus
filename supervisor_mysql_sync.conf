[program:notifybus-mysql-sync]
command=/usr/bin/php /var/www/html/NotifyBus/artisan mysql:sync --watch --mode=new
directory=/var/www/html/NotifyBus
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/NotifyBus/storage/logs/mysql-sync.log
stderr_logfile=/var/www/html/NotifyBus/storage/logs/mysql-sync-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=LARAVEL_ENV="production"

